name: Backend linting

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-linting.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-linting.yml"

permissions:
  contents: read

concurrency:
  group: backend-linting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run critical Ruff checks
        run: |
          uv run ruff check . \
          --select=E9,F63,F7,F82 \
          --output-format=github

      - name: Run full Ruff report
        run: |
          uv run ruff check . \
          --exit-zero \
          --statistics
