name: Backend linting

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-linting.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-linting.yml"

permissions:
  contents: read

concurrency:
  group: backend-linting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check for critical Python errors
        run: >
          uv run flake8 api database preprocessing
          --count
          --select=E9,F63,F7,F82
          --show-source
          --statistics

      - name: Report style and complexity issues
        run: >
          uv tool run flake8 api database preprocessing
          --count
          --exit-zero
          --max-complexity=10
          --max-line-length=127
          --statistics
