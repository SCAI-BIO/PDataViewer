version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci/cd"

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    labels:
      - "chore"
      - "python:uv"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

    groups:
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "react-router"
          - "@types/react"
          - "@types/react-dom"

      vite-tooling:
        applies-to: version-updates
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@rolldown/*"
          - "@babel/*"
          - "babel-plugin-react-compiler"

      other-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

    labels:
      - "chore"
      - "typescript"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
      - "docker"
