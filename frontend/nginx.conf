
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the application and support SPA navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always check for a newer application entry point.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite generates content-hashed asset filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
