<main class="page-layout">
  <!-- Loading Overlay -->
  @if (isLoading()) {
    <app-loading-spinner></app-loading-spinner>
  }

  <section class="page-header">
    <h1 class="page-title">Variable-specific Follow-up</h1>
  </section>

  <section class="output-section">
    <div class="output-box">
      <div class="plot-scroll" tabindex="0" role="region" aria-label="Participant follow-up chart">
        <div id="lineplot" class="plot-area" appPlotHost></div>
      </div>
    </div>
  </section>
</main>
