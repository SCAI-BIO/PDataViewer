<mat-toolbar class="banner">
  <a class="logo-link" routerLink="/" aria-label="PDataViewer home">
    <img class="logo" src="logos/logo_white.svg" alt="" />
  </a>
  <span class="site-title">PDataViewer</span>

  <nav class="routing-menu" aria-label="Main navigation">
    @for (item of navigation; track item.path) {
      <a
        mat-button
        [routerLink]="item.path"
        routerLinkActive="nav-active"
        ariaCurrentWhenActive="page"
        >{{ item.label }}</a
      >
    }
  </nav>

  <span class="spacer"></span>

  <a
    mat-icon-button
    class="github-button"
    href="https://github.com/SCAI-BIO/PDataViewer"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="View project on GitHub (opens a new tab)"
  >
    <img class="github-logo" src="social-media/github-mark-white.svg" alt="" />
  </a>

  <button
    mat-icon-button
    class="mobile-menu-trigger"
    [matMenuTriggerFor]="mobileNavigation"
    aria-label="Open navigation menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileNavigation="matMenu" xPosition="before">
    @for (item of navigation; track item.path) {
      <a
        mat-menu-item
        [routerLink]="item.path"
        routerLinkActive="mobile-nav-active"
        ariaCurrentWhenActive="page"
        >{{ item.label }}</a
      >
    }
  </mat-menu>
</mat-toolbar>
